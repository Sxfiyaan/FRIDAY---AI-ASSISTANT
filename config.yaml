provider: groq
providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY
  ollama:
    base_url: http://localhost:11434/v1
    model: qwen3.5:9b
    api_key_env: OLLAMA_API_KEY
request:
  timeout_seconds: 60
  retries: 2
logging:
  path: logs/friday.jsonl
