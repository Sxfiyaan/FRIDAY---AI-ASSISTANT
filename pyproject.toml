[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "friday-assistant"
version = "0.1.0"
description = "A personal assistant with configurable LLM providers"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.scripts]
friday = "friday.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["friday"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
